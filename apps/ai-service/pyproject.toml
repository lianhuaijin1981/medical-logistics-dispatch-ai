[project]
name = "med-ai-service"
version = "0.0.0"
description = "AI Microservice — 医药物流调度算法引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "aiokafka>=0.11.0",
    "redis>=5.2.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    "ortools>=9.11.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "redis[hiredis]>=5.2.0",
    "python-multipart>=0.0.18",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
